name: Deploy to Firebase Hosting

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file from secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Update web/config.js with Google Client ID
        run: |
          cat > web/config.js << 'CONFIGEOF'
          window.appConfig = {
            googleClientId: '${{ secrets.GOOGLE_CLIENT_ID }}',
          };
          CONFIGEOF

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Write Firebase Service Account to file
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Debug: Checking Firebase key length..."
          echo "${#FIREBASE_KEY} characters"
          echo "Debug: Writing to /tmp/firebase-key.json..."
          echo "$FIREBASE_KEY" > /tmp/firebase-key.json
          echo "Debug: File created. First 50 chars:"
          head -c 50 /tmp/firebase-key.json
          echo ""
          echo "Debug: Validating JSON..."
          cat /tmp/firebase-key.json | jq . > /dev/null && echo "✅ JSON is valid" || echo "❌ JSON is invalid"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: /tmp/firebase-key.json
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
